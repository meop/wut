---
git:
  maps:
    - in: gitconfig
      out:
        darwin: '{HOME}/.gitconfig'
        linux: '{HOME}/.gitconfig'
        windows: '{HOME}/.gitconfig'
nu:
  aliases:
    - nushell
  maps:
    - in: nu
      out:
        darwin: '{HOME}/.config/nushell/autoload'
        linux: '{HOME}/.config/nushell/autoload'
        windows: '{APPDATA}/nushell/autoload'
    - in: env.nu
      out:
        darwin: '{HOME}/.config/nushell/env.nu'
        linux: '{HOME}/.config/nushell/env.nu'
        windows: '{APPDATA}/nushell/env.nu'
    - in: config.nu
      out:
        darwin: '{HOME}/.config/nushell/config.nu'
        linux: '{HOME}/.config/nushell/config.nu'
        windows: '{APPDATA}/nushell/config.nu'
pwsh:
  maps:
    - in: pwsh
      out:
        darwin: '{HOME}/.pwsh'
        linux: '{HOME}/.pwsh'
        windows: '{HOME}/.pwsh'
    - in: env.ps1
      out:
        darwin: '{HOME}/.config/powershell/env.ps1'
        linux: '{HOME}/.config/powershell/env.ps1'
        windows: '{HOME}/Documents/PowerShell/env.ps1'
    - in: profile.ps1
      out:
        darwin: '{HOME}/.config/powershell/profile.ps1'
        linux: '{HOME}/.config/powershell/profile.ps1'
        windows: '{HOME}/Documents/PowerShell/profile.ps1'
ssh:
  maps:
    - in: config
      out:
        darwin: '{HOME}/.ssh/config'
        linux: '{HOME}/.ssh/config'
        windows: '{HOME}/.ssh/config'
      permission:
        user:
          read: true
          write: true
    - in: hushlogin
      out:
        darwin: '{HOME}/.hushlogin'
        linux: '{HOME}/.hushlogin'
        windows: '{HOME}/.hushlogin'
zsh:
  maps:
    - in: zsh
      out:
        darwin: '{HOME}/.zsh'
        linux: '{HOME}/.zsh'
    - in: zshenv
      out:
        darwin: '{HOME}/.zshenv'
        linux: '{HOME}/.zshenv'
    - in: zshrc
      out:
        darwin: '{HOME}/.zshrc'
        linux: '{HOME}/.zshrc'
