---
kind: Build
images:
  - name: localhost/app:latest
    filePath: '/virt/{host}/podman/{pod}/Dockerfile.app'
    buildContextPath: '/srv/virt/podman/{host}/{pod}'
---
kind: Pod
metadata:
  name: '{pod}'
  annotations:
    io.podman.kube.network: net0
    io.podman.kube.podmanargs.mac-address: '02:50:6f:00:77:65'
spec:
  hostname: '{pod}'
