---
cargo:
  setup:
    nu:
      has_cmd:
        - cargo
      sys_os_plat:
        - darwin
        - linux
        - windows
    pwsh:
      has_cmd:
        - cargo
      sys_os_plat:
        - windows
    zsh:
      has_cmd:
        - cargo
      sys_os_plat:
        - darwin
        - linux
desktop:
  setup:
    zsh:
      sys_os_de:
        - gnome
      sys_os_plat:
        - linux
distro:
  setup:
    zsh:
      has_path:
        - /etc/wsl.conf
      sys_os_plat:
        - linux
docker:
  repo:
    zsh:
      sys_os_plat:
        - linux
  setup:
    pwsh:
      has_cmd:
        - docker
      sys_os_plat:
        - linux
        - windows
    zsh:
      has_cmd:
        - docker
      sys_os_plat:
        - linux
  teardown:
    zsh:
      has_cmd:
        - docker
      sys_os_plat:
        - linux
local:
  repair:
    zsh:
      no_ssh: true
      sys_os_plat:
        - linux
rustup:
  add:
    zsh:
      no_cmd:
        - rustup
      sys_os_plat:
        - linux
scriptfile:
  add:
    zsh:
      sys_os_plat:
        - linux
standalone:
  sync:
    nu:
      has_path:
        - ~/.standalone/bin/standalone
        - ~/.standalone/bin/standalone.exe
      sys_os_plat:
        - darwin
        - linux
        - windows
